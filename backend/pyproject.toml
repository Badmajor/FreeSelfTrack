[project]
name = "freeselftrack-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "python-multipart>=0.0.20,<1.0",
    "pillow>=11,<13",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.29,<1.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.9,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "redis>=5,<7",
    "minio>=7.2,<8",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "fakeredis[lua]>=2.28,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true


[tool.setuptools.packages.find]
include = ["app*"]
