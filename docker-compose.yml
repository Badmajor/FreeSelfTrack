services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  minio-init:
    image: alpine:3.21
    command: ["sh", "-c", "chown -R 1001:1001 /data"]
    volumes:
      - minio_data:/data
    networks: [app]

  minio:
    image: openvidu/minio@sha256:211ea94d3487bc42f9b4140f86c7d0123edba3c24160d0ef1057911504405c8e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1 && mc admin info local >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set a random AUTH_SECRET_KEY of at least 32 bytes}
      TRACKER_REDIS_URL: redis://redis:6379/0
      TRACKER_TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-[]}
      TRACKER_CORS_ORIGINS: '["${PUBLIC_APP_URL:-http://localhost:5173}"]'
      TRACKER_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  deadline-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.deadlines"]
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set a random AUTH_SECRET_KEY of at least 32 bytes}
      TRACKER_DEADLINE_WORKER_INTERVAL_SECONDS: ${DEADLINE_WORKER_INTERVAL_SECONDS:-60}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  registration-mail-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.registration_mail"]
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set a random AUTH_SECRET_KEY of at least 32 bytes}
      TRACKER_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      TRACKER_SMTP_HOST: ${SMTP_HOST:-localhost}
      TRACKER_SMTP_PORT: ${SMTP_PORT:-587}
      TRACKER_SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      TRACKER_SMTP_USERNAME: ${SMTP_USERNAME:-}
      TRACKER_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TRACKER_SMTP_SENDER: ${SMTP_SENDER:-noreply@example.com}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app:
