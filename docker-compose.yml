services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  minio:
    image: openvidu/minio@sha256:211ea94d3487bc42f9b4140f86c7d0123edba3c24160d0ef1057911504405c8e
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-tracker-attachments}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = minio && mc alias set local http://localhost:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null 2>&1 && mc ls \"local/$${MINIO_DEFAULT_BUCKETS}\" >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set a random AUTH_SECRET_KEY of at least 32 bytes}
      TRACKER_REDIS_URL: redis://redis:6379/0
      TRACKER_S3_ENDPOINT: minio:9000
      TRACKER_S3_BUCKET: ${S3_BUCKET:-tracker-attachments}
      TRACKER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      TRACKER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      TRACKER_S3_SECURE: "false"
      TRACKER_ATTACHMENT_UPLOAD_SLOTS: ${ATTACHMENT_UPLOAD_SLOTS:-2}
      TRACKER_ATTACHMENT_DOWNLOAD_SLOTS: ${ATTACHMENT_DOWNLOAD_SLOTS:-4}
      TRACKER_TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-[]}
      TRACKER_CORS_ORIGINS: '["${PUBLIC_APP_URL:-http://localhost:5173}"]'
      TRACKER_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:size=384m,mode=1777
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  clamav:
    image: clamav/clamav@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    environment:
      FRESHCLAM_CHECKS: "24"
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_MaxRecursion: "16"
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_MaxScanTime: "30000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_MaxThreads: "2"
      CLAMD_CONF_MaxQueue: "4"
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    restart: unless-stopped
    networks: [app]

  attachment-scan-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.attachment_scan"]
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
      TRACKER_S3_ENDPOINT: minio:9000
      TRACKER_S3_BUCKET: ${S3_BUCKET:-tracker-attachments}
      TRACKER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      TRACKER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      TRACKER_S3_SECURE: "false"
      TRACKER_CLAMD_HOST: clamav
      TRACKER_CLAMD_PORT: "3310"
      TRACKER_ATTACHMENT_SCAN_INTERVAL_SECONDS: ${ATTACHMENT_SCAN_INTERVAL_SECONDS:-5}
      TRACKER_ATTACHMENT_SCAN_TIMEOUT_SECONDS: ${ATTACHMENT_SCAN_TIMEOUT_SECONDS:-60}
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      backend:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  attachment-cleanup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.attachment_cleanup"]
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
      TRACKER_S3_ENDPOINT: minio:9000
      TRACKER_S3_BUCKET: ${S3_BUCKET:-tracker-attachments}
      TRACKER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      TRACKER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      TRACKER_S3_SECURE: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  deadline-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.deadlines"]
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set a random AUTH_SECRET_KEY of at least 32 bytes}
      TRACKER_DEADLINE_WORKER_INTERVAL_SECONDS: ${DEADLINE_WORKER_INTERVAL_SECONDS:-60}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  registration-mail-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.registration_mail"]
    environment:
      TRACKER_DATABASE_URL: ${TRACKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      TRACKER_AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set a random AUTH_SECRET_KEY of at least 32 bytes}
      TRACKER_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      TRACKER_SMTP_HOST: ${SMTP_HOST:-localhost}
      TRACKER_SMTP_PORT: ${SMTP_PORT:-587}
      TRACKER_SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      TRACKER_SMTP_USERNAME: ${SMTP_USERNAME:-}
      TRACKER_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TRACKER_SMTP_SENDER: ${SMTP_SENDER:-noreply@example.com}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  app:
